name: Prerelease (Github Package Registry)

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/klage-kodeverk:${{ github.sha }}

jobs:
  prerelease:
    name: Create prerelease
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        name: Checkout
      - name: Setup Java 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: 25
          distribution: temurin
      - id: next_version
        uses: zwaldowski/semver-release-action@v6
        name: Prepare and tag release with semver
        with:
          bump: prerelease
          preid: rc
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: upload artifact
        run: ./gradlew -Pversion="$(echo ${{steps.next_version.outputs.version_tag}})" publish
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub prerelease
        run: gh release create "v$VERSION" --title "v$VERSION" --prerelease
        env:
          VERSION: ${{ steps.next_version.outputs.version_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}